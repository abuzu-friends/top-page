<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アブーズフレンズ - トップ</title>
<style>
  body { font-family: sans-serif; background: #f0f2f5; padding: 20px; display: flex; flex-direction: column; align-items: center; }
  .container { width: 100%; max-width: 400px; display: none; } /* 初期は非表示 */
  h1 { text-align: center; color: #333; margin-bottom: 30px; }
  .menu-item { background: white; padding: 20px; border-radius: 12px; text-decoration: none; color: #333; display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; transition: 0.2s; }
  .menu-item:active { transform: scale(0.98); background: #fafafa; }
  .icon { font-size: 1.8rem; margin-right: 15px; width: 40px; text-align: center; }
  .title { font-weight: bold; display: block; font-size: 1.05rem; }
  .desc { font-size: 0.8rem; color: #999; }

  /* メンテナンス画面 */
  #maintenanceView {
    text-align: center; background: white; padding: 40px 20px;
    border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 50px;
    border-top: 6px solid #f39c12;
  }
  .m-icon { font-size: 4rem; margin-bottom: 20px; }
  .m-period { background: #fff9eb; color: #d35400; padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-top: 15px; border: 1px solid #ffeaa7; }
  /* --- 右上のロード中インジケーター --- */
        #mini-loader {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7); /* 黒背景（透過） */
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.4s ease;
            pointer-events: none; /* 下のコンテンツの操作を邪魔しない */
        }

        /* 小さなくるくるアニメーション */
        .dot-spin {
            width: 12px;
            height: 12px;
            margin-right: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 読み込み完了後に消す用 */
        .hidden {
            opacity: 0;
        }

</style>
</head>
<body>
<!-- ロード中インジケーター -->
    <div id="mini-loader">
        <div class="dot-spin"></div>
        <span>ロード中...</span>
    </div>
<div class="container" id="mainView">
  <h1>アブーズフレンズ</h1>
  <a href="./redirect.html?sort-abuzu" class="menu-item">
    <div class="icon">📷</div>
    <div class="content"><span class="title">写真掲載ページ</span><span class="desc">紙工作の写真(加工済)を掲載しています</span></div>
  </a>
  <a href="./redirect.html?sort-abuzu-keihin" class="menu-item">
    <div class="icon">🎀</div>
    <div class="content"><span class="title">特別景品の確認</span><span class="desc">特別景品の確認ができます</span></div>
  </a>
</div>

<div class="container" id="maintenanceView">
  <div class="m-icon">❗</div>
  <h2 style="margin:0;">サイト休止中</h2>
  <p id="mMessage" style="color:#666; line-height:1.6; margin-top:15px;"></p>
  <div class="m-period" id="mPeriod"></div>
  <p style="font-size: 0.8rem; color: #bbb; margin-top: 25px;">只今休止中です。</p>
</div>
<p>Copyright © 2026 アブーズフレンズ All Rights Reserved.</p>
<script>
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyKQ6G9CANpdXI6jK0W2_XQ-9EkofOhSE6tOJaak4_xjwBFH7ACKoq3N6wX05ryFs_R/exec";

async function init() {
  try {
    const res = await fetch(`${WEBAPP_URL}?mode=checkMaintenance`);
    const data = await res.json();
    
    if (data.isMaintenance) {
      document.getElementById("mMessage").textContent = data.message;
      document.getElementById("mPeriod").textContent = "予定期間： " + data.period;
      document.getElementById("maintenanceView").style.display = "block";
    } else {
      document.getElementById("mainView").style.display = "block";
    }
  } catch (e) {
    // 通信エラー時はメインを表示
    document.getElementById("mainView").style.display = "block";
  }
}

window.onload = init;
</script>
<script>
        // 全リソースの読み込みが完了したら実行
        window.onload = function() {
            const loader = document.getElementById('mini-loader');
            loader.classList.add('hidden');
        };
</script>
</body>
</html>
