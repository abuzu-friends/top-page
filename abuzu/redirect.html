<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リダイレクト先のページに移動しています</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
    <!-- JavaScriptが動かなかった場合の保険として5秒後にトップへ -->
<noscript>
    <meta http-equiv="refresh" content="5; url="index.html">
</noscript>
<body>
    <p>最新のページへ移動しています...</p><br><small>しばらくお待ちください。</small>

    <script>
        // --- 1. ここにファイルリストを手動で追加していきます ---
        const allFiles = [
            "pause.html",
            "picture.html",
            "picture260719.html"
        ];
        // --- 2. URLパラメータから検索キーワードを抽出 ---
        // 例: "?sort-rikouho" -> "rikouho"
        const params = window.location.search.substring(1);
        
        if (params.startsWith("sort-")) {
            const keyword = params.replace("sort-", "");

            // --- 3. キーワードに一致するファイルを抽出 ---
            const matchedFiles = allFiles.filter(file => file.startsWith(keyword));

            if (matchedFiles.length > 0) {
                // --- 4. 並び替えて最新（降順）のトップを取得 ---
                // 文字列の比較により rikouho250503.html が rikouho250429.html より優先されます
                // ※rikouho.html(日付なし)より日付ありが優先されるようソート
                matchedFiles.sort((a, b) => b.localeCompare(a));

                const latestFile = matchedFiles[0];
                window.location.href = latestFile;
            } else {
                document.body.innerHTML = "<p>該当するページが見つかりませんでした。3秒後にトップページに戻ります。</p>";
                setTimeout(() => {
            window.location.href = "index.html";
        }, 3000);
            }
        }

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwHXnB2SZmgfi1n-4w8NuhnwiBj33I97vYM6WMr8bN3AJixFDuHk3G4Y8kLduuZM9it/exec";

async function checkAccess() {
  // URLからパラメータを取得
  const urlParams = new URLSearchParams(window.location.search);
  const key = urlParams.get('key');
  const sort = window.location.search;

  // 休止中リダイレクト（sort-pause）の場合はチェックをスキップして表示
  if (sort.includes('sort-pause')) {
    return; 
  }

  if (!key) {
    // 鍵を持っていない（直接URLを叩いた）場合はトップへ戻す
    alert("直接アクセスは禁止されています。");
    window.location.href = "./index.html";
    return;
  }

  try {
    // GASに鍵の正当性を問い合わせる
    const res = await fetch(`${WEBAPP_URL}?mode=verifyKey&key=${key}`);
    const data = await res.json();

    if (!data.valid) {
      // 鍵が無効（時間切れ、または不正な鍵）の場合
      alert("アクセス有効期限が切れたか、不正なアクセスです。");
      window.location.href = "./index.html";
    }
    // 正しい場合はそのままページを表示し続ける
  } catch (e) {
    window.location.href = "./index.html";
  }
}

// ページ読み込み時に実行
window.onload = checkAccess;
    </script>
</body>
</html>
